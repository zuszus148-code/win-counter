<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIN Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;color:#fff;display:grid;place-items:center}
.overlay{display:inline-flex;flex-direction:column;align-items:center;gap:8px;padding:10px 18px;border-radius:18px;background:rgba(14,8,23,.78);border:1px solid rgba(177,120,255,.55);box-shadow:0 8px 30px rgba(0,0,0,.3),0 0 24px rgba(155,92,255,.12);backdrop-filter:blur(6px)}
.title{font-size:13px;font-weight:900;letter-spacing:4px;color:#c9a7ff}
.counter{font-size:64px;font-weight:950;line-height:1;white-space:nowrap;text-shadow:0 0 18px rgba(173,112,255,.3)}
.slash{color:#765b8b;font-size:.72em}.goal{color:#e0d0ef}
.track{width:100%;height:6px;background:#2a1b36;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#6d28d9,#c084fc);border-radius:99px;transition:width .18s}
.complete{font-size:12px;color:#d9b8ff;font-weight:900;letter-spacing:2px}
@media(max-width:500px){.counter{font-size:48px}}
</style>
</head>
<body>
<div class="overlay">
  <div class="title">WIN</div>
  <div class="counter"><span id="wins">0</span> <span class="slash">/</span> <span class="goal" id="goal">10</span></div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <div id="complete" class="complete" style="display:none">WIN COMPLETE!</div>
</div>
<script>
(() => {
  const KEY="win_counter_state_v2";
  const CHANNEL="win_counter_channel_v2";
  const bc="BroadcastChannel" in window?new BroadcastChannel(CHANNEL):null;
  let state={wins:0,goal:10};
  function valid(s){return s&&Number.isFinite(Number(s.wins))&&Number.isFinite(Number(s.goal))&&Number(s.goal)>0}
  function render(){
    document.getElementById("wins").textContent=String(state.wins);
    document.getElementById("goal").textContent=String(state.goal);
    document.getElementById("bar").style.width=Math.max(0,Math.min(100,state.wins/state.goal*100))+"%";
    document.getElementById("complete").style.display=state.wins>=state.goal?"block":"none";
  }
  function read(){
    try{const s=JSON.parse(localStorage.getItem(KEY));if(valid(s))state={wins:Number(s.wins),goal:Number(s.goal)}}catch(e){}
    render();
  }
  if(bc)bc.onmessage=e=>{if(e.data?.type==="state"&&valid(e.data.state)){state={wins:Number(e.data.state.wins),goal:Number(e.data.state.goal)};render()}};
  window.addEventListener("storage",e=>{if(e.key===KEY)read()});
  read();
  setInterval(read,1000);
})();
</script>
</body>
</html>
